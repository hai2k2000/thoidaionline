name: Production Standalone Artifact

on:
  pull_request:
    branches: [integration/production]
  push:
    branches: [integration/production, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      THOIDAI_RUNTIME_ENV_MODEL: runtime-injected
      THOIDAI_BUILD_CONFIG: ${{ github.ref == 'refs/heads/integration/production' && 'canonical-public' || 'ci-placeholder' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ github.ref == 'refs/heads/integration/production' && vars.THOIDAI_PUBLIC_SUPABASE_URL || 'https://ci.invalid/supabase' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ github.ref == 'refs/heads/integration/production' && vars.THOIDAI_PUBLIC_SUPABASE_ANON_KEY || 'ci-anon-key-placeholder' }}
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key-placeholder-01234567890123456789
      SESSION_SECRET: ci-session-secret-placeholder-01234567890123456789
      # The repository lineage guard requires production-shaped builds to identify
      # as the canonical integration branch even when Actions checks a PR merge ref.
      THOIDAI_RELEASE_BRANCH: integration/production
      THOIDAI_REMOTE_HEAD: pending
      THOIDAI_INTEGRATION_COMMIT: ${{ github.sha }}
      THOIDAI_CONTRACT_SUITE_RESULT: ci-not-run-without-production-session
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare canonical ref for lineage checks
        run: |
          git fetch origin integration/production:refs/remotes/origin/integration/production
          remote_sha=$(git rev-parse refs/remotes/origin/integration/production)
          if git show-ref --verify --quiet refs/heads/integration/production; then
            local_sha=$(git rev-parse refs/heads/integration/production)
            test "$local_sha" = "$remote_sha" || {
              echo "Canonical ref mismatch: local=$local_sha remote=$remote_sha" >&2
              exit 1
            }
          else
            git branch integration/production "$remote_sha"
          fi
          echo "THOIDAI_REMOTE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "THOIDAI_INTEGRATION_COMMIT=$remote_sha" >> "$GITHUB_ENV"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Focused repository tests
        run: >-
          node --test
          scripts/artifact-provenance.test.mjs
          scripts/artifact-manifest.test.mjs
          scripts/artifact-secret-scan.test.mjs
          scripts/ci-build-env.test.mjs
          scripts/canonical-build-env.test.mjs
          scripts/canonical-ref-preparation.test.mjs
          scripts/deploy-gate.test.mjs
          scripts/package-standalone.test.mjs
          scripts/standalone-packaging.test.mjs
          scripts/external-artifact-contract.test.mjs
          scripts/artifact-roundtrip.test.mjs
      - name: Retention regression
        run: bash scripts/production/release-retention-managed.test.sh
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npx eslint scripts/package-standalone.mjs scripts/artifact-manifest.mjs scripts/materialize-artifact-symlinks.mjs scripts/verify-artifact-manifest.mjs scripts/verify-standalone-artifact.mjs scripts/scan-artifact-secrets.mjs scripts/check-ci-build-env.mjs scripts/check-canonical-build-env.mjs scripts/external-artifact-contract.test.mjs scripts/artifact-roundtrip.test.mjs scripts/verify-artifact-roundtrip.mjs scripts/canonical-build-env.test.mjs
      - name: Route manifest
        run: npm run check:routes
      - name: Validate non-production build configuration
        if: env.THOIDAI_BUILD_CONFIG == 'ci-placeholder'
        run: node scripts/check-ci-build-env.mjs
      - name: Validate canonical public build configuration
        if: env.THOIDAI_BUILD_CONFIG == 'canonical-public'
        run: node scripts/check-canonical-build-env.mjs
      - name: Production-like build
        run: npm run build
      - name: Package standalone artifact
        run: npm run package:standalone
        env:
          STANDALONE_ARTIFACT_DIR: ${{ runner.temp }}/thoidai-standalone
      - name: Materialize internal symlinks for ZIP portability
        run: node scripts/materialize-artifact-symlinks.mjs "$RUNNER_TEMP/thoidai-standalone"
      - name: Refresh artifact manifest after portability normalization
        run: node scripts/artifact-manifest.mjs "$RUNNER_TEMP/thoidai-standalone"
      - name: Verify artifact provenance and checksums
        run: |
          node scripts/verify-standalone-artifact.mjs "$RUNNER_TEMP/thoidai-standalone"
          node scripts/scan-artifact-secrets.mjs "$RUNNER_TEMP/thoidai-standalone"
      - name: Upload immutable artifact
        uses: actions/upload-artifact@v4
        with:
          name: thoidai-standalone-${{ github.sha }}
          path: ${{ runner.temp }}/thoidai-standalone
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Download artifact round-trip
        uses: actions/download-artifact@v4
        with:
          name: thoidai-standalone-${{ github.sha }}
          path: ${{ runner.temp }}/thoidai-roundtrip
      - name: Verify artifact round-trip
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/thoidai-roundtrip"
          for path in .release-meta .artifact-manifest.json .artifact-manifest.sha256 .next/BUILD_ID .next/static server.js required-route-manifest.json; do
            test -e "$root/$path" || { echo "round-trip artifact missing: $path" >&2; exit 1; }
          done
          test ! -e "$root/.env"
          test ! -e "$root/.env.local"
          test ! -e "$root/.env.production"
          mkdir -p "$root/.next/cache"
          node scripts/verify-standalone-artifact.mjs "$root"
          node scripts/scan-artifact-secrets.mjs "$root"
          node scripts/verify-artifact-roundtrip.mjs "$root"
