name: Phase 3B.1 Isolated Authenticated E2E
# NO production credentials, endpoints, backups, or runtime secrets are used.

on:
  workflow_dispatch:
  pull_request:
    branches: [integration/production]
    paths:
      - 'scripts/e2e/**'
      - '.github/workflows/phase3b-isolated-e2e.yml'
      - 'PROJECT_STATUS.md'

permissions:
  contents: read

concurrency:
  group: phase3b-isolated-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-authenticated-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      OLD_APP_COMMIT: bd4803933d6b98fd6996852992be566e6286ea67
      NEW_APP_COMMIT: 9acead5accc6d439d63f89655d8066ee66b9dbda
    steps:
      - name: Checkout harness source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare canonical lineage ref
        shell: bash
        run: |
          git fetch origin integration/production:refs/remotes/origin/integration/production
          remote_sha=$(git rev-parse refs/remotes/origin/integration/production)
          if git show-ref --verify --quiet refs/heads/integration/production; then
            test "$(git rev-parse refs/heads/integration/production)" = "$remote_sha"
          else
            git branch integration/production "$remote_sha"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install harness dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate harness contracts
        run: node --test scripts/e2e/isolated-e2e.test.mjs

      - name: Start disposable PostgreSQL/PostgREST sandbox
        shell: bash
        run: |
          bash scripts/e2e/start-sandbox.sh
          set -a; source "$RUNNER_TEMP/thoidai-e2e.env"; set +a
          gateway_port=$((20000 + ($$ % 700)))
          echo "E2E_SUPABASE_URL=http://127.0.0.1:${gateway_port}" >> "$RUNNER_TEMP/thoidai-e2e.env"
          {
            cat "$RUNNER_TEMP/thoidai-e2e.env"
            echo "E2E_SUPABASE_URL=http://127.0.0.1:${gateway_port}"
          } >> "$GITHUB_ENV"

      - name: Verify Supabase SDK sandbox prefix contract
        shell: bash
        run: |
          set -a; source "$RUNNER_TEMP/thoidai-e2e.env"; set +a
          gateway_port=$((21000 + ($$ % 500)))
          export E2E_SUPABASE_URL="http://127.0.0.1:${gateway_port}"
          E2E_GATEWAY_PORT="${E2E_SUPABASE_URL##*:}" node "$GITHUB_WORKSPACE/scripts/e2e/sandbox-gateway.mjs" "$E2E_POSTGREST_URL" > "$RUNNER_TEMP/thoidai-gateway.log" 2>&1 &
          gateway_pid=$!
          cleanup_gateway() { kill "$gateway_pid" 2>/dev/null || true; wait "$gateway_pid" 2>/dev/null || true; }
          trap cleanup_gateway EXIT
          for _ in $(seq 1 30); do curl -fsS "$E2E_SUPABASE_URL/health" >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS "$E2E_SUPABASE_URL/health" >/dev/null
          node scripts/e2e/supabase-sdk-probe.mjs

      - name: Prepare exact old and new source worktrees
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/thoidai-old" "$OLD_APP_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/thoidai-new" "$NEW_APP_COMMIT"

      - name: Build old application with sandbox public endpoint
        shell: bash
        working-directory: ${{ runner.temp }}/thoidai-old
        env:
          ROLE_LIFECYCLE_ENABLED: 'false'
          THOIDAI_BUILD_CONFIG: sandbox-e2e
          THOIDAI_RELEASE_BRANCH: integration/production
          THOIDAI_INTEGRATION_COMMIT: 9acead5accc6d439d63f89655d8066ee66b9dbda
          THOIDAI_REMOTE_HEAD: 9acead5accc6d439d63f89655d8066ee66b9dbda
        run: |
          set -a; source "$RUNNER_TEMP/thoidai-e2e.env"; set +a
          gateway_port=$((22000 + (GITHUB_RUN_ID % 500)))
          export E2E_SUPABASE_URL="http://127.0.0.1:${gateway_port}"
          export NEXT_PUBLIC_SUPABASE_URL="$E2E_SUPABASE_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$E2E_ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$E2E_SERVICE_ROLE_KEY"
          export SESSION_SECRET="$E2E_SESSION_SECRET"
          npm ci --no-audit --no-fund
          npm run build
          cp -a .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -a public .next/standalone/public; fi

      - name: Build new RBAC V2 application with sandbox public endpoint
        shell: bash
        working-directory: ${{ runner.temp }}/thoidai-new
        env:
          ROLE_LIFECYCLE_ENABLED: 'true'
          THOIDAI_BUILD_CONFIG: sandbox-e2e
          THOIDAI_RELEASE_BRANCH: integration/production
          THOIDAI_INTEGRATION_COMMIT: 9acead5accc6d439d63f89655d8066ee66b9dbda
          THOIDAI_REMOTE_HEAD: 9acead5accc6d439d63f89655d8066ee66b9dbda
        run: |
          set -a; source "$RUNNER_TEMP/thoidai-e2e.env"; set +a
          gateway_port=$((23000 + (GITHUB_RUN_ID % 500)))
          export E2E_SUPABASE_URL="http://127.0.0.1:${gateway_port}"
          export NEXT_PUBLIC_SUPABASE_URL="$E2E_SUPABASE_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$E2E_ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$E2E_SERVICE_ROLE_KEY"
          export SESSION_SECRET="$E2E_SESSION_SECRET"
          npm ci --no-audit --no-fund
          npm run build
          cp -a .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -a public .next/standalone/public; fi

      - name: Install disposable browser runner
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --legacy-peer-deps playwright@1.51.1
          npx playwright install --with-deps chromium

      - name: Run old application authenticated HTTP E2E
        shell: bash
        working-directory: ${{ runner.temp }}/thoidai-old
        env:
          ROLE_LIFECYCLE_ENABLED: 'false'
          PORT: '3102'
        run: |
          set -a; source "$RUNNER_TEMP/thoidai-e2e.env"; set +a
          gateway_port=$((22000 + (GITHUB_RUN_ID % 500)))
          export E2E_SUPABASE_URL="http://127.0.0.1:${gateway_port}"
          E2E_GATEWAY_PORT="${E2E_SUPABASE_URL##*:}" node "$GITHUB_WORKSPACE/scripts/e2e/sandbox-gateway.mjs" "$E2E_POSTGREST_URL" > "$RUNNER_TEMP/thoidai-gateway.log" 2>&1 &
          gateway_pid=$!
          cleanup_gateway() { kill "$gateway_pid" 2>/dev/null || true; wait "$gateway_pid" 2>/dev/null || true; }
          trap cleanup_gateway EXIT
          for _ in $(seq 1 30); do curl -fsS "$E2E_SUPABASE_URL/health" >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS "$E2E_SUPABASE_URL/health" >/dev/null
          env ROLE_LIFECYCLE_ENABLED=false PORT=3102 NEXT_PUBLIC_SUPABASE_URL="$E2E_SUPABASE_URL" SUPABASE_SERVICE_ROLE_KEY="$E2E_SERVICE_ROLE_KEY" SESSION_SECRET="$E2E_SESSION_SECRET" nohup node .next/standalone/server.js > "$RUNNER_TEMP/thoidai-old.log" 2>&1 & echo $! > "$RUNNER_TEMP/thoidai-old.pid"
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:3102/login >/dev/null 2>&1 && break; sleep 1; done
          test -s "$RUNNER_TEMP/thoidai-old.pid"
          E2E_BASE_URL=http://127.0.0.1:3102 E2E_MODE=old node "$GITHUB_WORKSPACE/scripts/e2e/http-smoke.mjs"
          kill "$(cat "$RUNNER_TEMP/thoidai-old.pid")" || true

      - name: Diagnose isolated old-app login failure
        if: failure()
        shell: bash
        run: |
          diagnostics="$RUNNER_TEMP/thoidai-e2e-diagnostics"
          mkdir -p "$diagnostics"
          set -a; source "$RUNNER_TEMP/thoidai-e2e.env"; set +a
          docker exec "$E2E_POSTGRES_CONTAINER" psql -At -U postgres -d thoidai_e2e -c "select username, active, session_version, must_change_password, (password_hash is not null), (password is not null) from public.staff_users where username in ('e2e-admin','e2e-employee') order by username" > "$diagnostics/fixture-users.txt" 2>&1 || true
          curl -fsS -H "apikey: $E2E_SERVICE_ROLE_KEY" -H "Authorization: Bearer $E2E_SERVICE_ROLE_KEY" "$E2E_POSTGREST_URL/staff_users?username=eq.e2e-admin&select=username,active,session_version,must_change_password,password_hash,password,roles(active)" | sed -E 's/"password_hash":"[^"]+"/"password_hash":"[redacted]"/g; s/"password":"[^"]+"/"password":"[redacted]"/g' > "$diagnostics/postgrest-user.json" 2>&1 || true
          E2E_PASSWORD="$E2E_PASSWORD" E2E_POSTGREST_URL="$E2E_POSTGREST_URL" E2E_SERVICE_ROLE_KEY="$E2E_SERVICE_ROLE_KEY" node --input-type=module <<'NODE' > "$diagnostics/credential-probe.txt" 2>&1 || true
          import bcrypt from "bcryptjs";
          const base = process.env.E2E_POSTGREST_URL;
          const headers = { apikey: process.env.E2E_SERVICE_ROLE_KEY, authorization: `Bearer ${process.env.E2E_SERVICE_ROLE_KEY}` };
          const response = await fetch(`${base}/staff_users?username=eq.e2e-admin&select=active,password_hash` , { headers });
          const rows = await response.json();
          const row = rows[0];
          const legacyQuery = await fetch(`${base}/staff_users?or=(username.eq.e2e-admin,email.ilike.e2e-admin,phone.eq.e2e-admin)&select=id,username,password,password_hash,active,session_version,must_change_password&limit=1`, { headers: { ...headers, accept: "application/vnd.pgrst.object+json" } });
          const legacyBody = await legacyQuery.json();
          console.log(JSON.stringify({ status: response.status, rowCount: rows.length, active: row?.active === true, bcryptMatch: row?.password_hash ? await bcrypt.compare(process.env.E2E_PASSWORD, row.password_hash) : false, legacyStatus: legacyQuery.status, legacyActive: legacyBody?.active === true, legacyHashPresent: typeof legacyBody?.password_hash === "string", legacyBcryptMatch: legacyBody?.password_hash ? await bcrypt.compare(process.env.E2E_PASSWORD, legacyBody.password_hash) : false, legacyKeys: Object.keys(legacyBody).filter((key) => !["password", "password_hash"].includes(key)) }));
          NODE
          curl -sS -i -X POST -H "origin: http://127.0.0.1:3102" -H "host: 127.0.0.1:3102" -H "content-type: application/json" --data '{"identifier":"e2e-admin","password":"[redacted]"}' http://127.0.0.1:3102/api/auth/login | sed -E 's/(set-cookie: ).*/\1[redacted]/I' > "$diagnostics/login-response.txt" 2>&1 || true
          actual_response=$(curl -sS -w '\nSTATUS:%{http_code}' -X POST -H "origin: http://127.0.0.1:3102" -H "host: 127.0.0.1:3102" -H "content-type: application/json" --data "{\"identifier\":\"e2e-admin\",\"password\":\"$E2E_PASSWORD\"}" http://127.0.0.1:3102/api/auth/login || true)
          actual_status=$(printf '%s' "$actual_response" | sed -n 's/^STATUS://p')
          actual_body=$(printf '%s' "$actual_response" | sed '/^STATUS:/d' | tr '\n' ' ' | sed -E 's/[A-Za-z0-9_-]{32,}/[redacted]/g')
          echo "actual-password-status=$actual_status body=$actual_body" >> "$diagnostics/credential-probe.txt"
          tail -n 120 "$RUNNER_TEMP/thoidai-old.log" > "$diagnostics/old-app.log" 2>&1 || true
          tail -n 120 "$RUNNER_TEMP/thoidai-gateway.log" > "$diagnostics/gateway.log" 2>&1 || true
          while IFS= read -r line; do
            line=$(printf '%s' "$line" | sed -E 's/[A-Za-z0-9_-]{32,}/[redacted]/g; s/(set-cookie: ).*/\1[redacted]/I')
            echo "::error title=Isolated E2E diagnostic::$line"
          done < "$diagnostics/login-response.txt"
          while IFS= read -r line; do
            line=$(printf '%s' "$line" | sed -E 's/[A-Za-z0-9_-]{32,}/[redacted]/g')
            echo "::warning title=Old app log::$line"
          done < "$diagnostics/old-app.log"
          while IFS= read -r line; do
            echo "::warning title=Credential probe::$line"
          done < "$diagnostics/credential-probe.txt"
          while IFS= read -r line; do
            echo "::warning title=Sandbox gateway::$line"
          done < "$diagnostics/gateway.log"

      - name: Upload isolated E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase3b1-e2e-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/thoidai-e2e-diagnostics
          if-no-files-found: warn
          include-hidden-files: false

      - name: Run new application authenticated HTTP and browser E2E
        shell: bash
        working-directory: ${{ runner.temp }}/thoidai-new
        env:
          ROLE_LIFECYCLE_ENABLED: 'true'
          PORT: '3103'
          TASK_RBAC_V2_ENABLED: 'true'
        run: |
          set -a; source "$RUNNER_TEMP/thoidai-e2e.env"; set +a
          gateway_port=$((23000 + (GITHUB_RUN_ID % 500)))
          export E2E_SUPABASE_URL="http://127.0.0.1:${gateway_port}"
          E2E_GATEWAY_PORT="${E2E_SUPABASE_URL##*:}" node "$GITHUB_WORKSPACE/scripts/e2e/sandbox-gateway.mjs" "$E2E_POSTGREST_URL" > "$RUNNER_TEMP/thoidai-gateway.log" 2>&1 &
          gateway_pid=$!
          cleanup_gateway() {
            status=$?
            if [ "$status" -ne 0 ]; then
              tail -n 120 "$RUNNER_TEMP/thoidai-new.log" 2>/dev/null | while IFS= read -r line; do echo "::error title=New app log::$line"; done || true
              tail -n 120 "$RUNNER_TEMP/thoidai-gateway.log" 2>/dev/null | while IFS= read -r line; do echo "::warning title=Sandbox gateway::$line"; done || true
            fi
            kill "$gateway_pid" 2>/dev/null || true
            wait "$gateway_pid" 2>/dev/null || true
            return "$status"
          }
          trap cleanup_gateway EXIT
          for _ in $(seq 1 30); do curl -fsS "$E2E_SUPABASE_URL/health" >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS "$E2E_SUPABASE_URL/health" >/dev/null
          env ROLE_LIFECYCLE_ENABLED=true TASK_RBAC_V2_ENABLED=true PORT=3103 NEXT_PUBLIC_SUPABASE_URL="$E2E_SUPABASE_URL" SUPABASE_SERVICE_ROLE_KEY="$E2E_SERVICE_ROLE_KEY" SESSION_SECRET="$E2E_SESSION_SECRET" nohup node .next/standalone/server.js > "$RUNNER_TEMP/thoidai-new.log" 2>&1 & echo $! > "$RUNNER_TEMP/thoidai-new.pid"
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:3103/login >/dev/null 2>&1 && break; sleep 1; done
          test -s "$RUNNER_TEMP/thoidai-new.pid"
          set +e
          E2E_BASE_URL=http://127.0.0.1:3103 node "$GITHUB_WORKSPACE/scripts/e2e/http-smoke.mjs" > "$RUNNER_TEMP/thoidai-new-http.log" 2>&1
          http_status=$?
          set -e
          if [ "$http_status" -ne 0 ]; then
            summary=$(grep -E 'Error:|expected|missing|cannot' "$RUNNER_TEMP/thoidai-new-http.log" | head -n 1 || true)
            echo "::error title=New HTTP failure::$summary"
            exit "$http_status"
          fi
          browser_path=$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux/chrome' | head -n 1)
          echo "browser_path=${browser_path:-missing}"
          test -n "$browser_path"
          set +e
          E2E_BASE_URL=http://127.0.0.1:3103 E2E_BROWSER_EXECUTABLE_PATH="$browser_path" node "$GITHUB_WORKSPACE/scripts/e2e/browser-smoke.mjs" > "$RUNNER_TEMP/thoidai-new-browser.log" 2>&1
          browser_status=$?
          set -e
          if [ "$browser_status" -ne 0 ]; then
            summary=$(grep -E 'Error:|expected|missing|cannot' "$RUNNER_TEMP/thoidai-new-browser.log" | head -n 1 || true)
            echo "::error title=Browser failure::$summary"
            exit "$browser_status"
          fi
          kill "$(cat "$RUNNER_TEMP/thoidai-new.pid")" || true

      - name: Diagnose isolated new-app E2E failure
        if: failure()
        shell: bash
        run: |
          echo "::error title=New app process::$(cat "$RUNNER_TEMP/thoidai-new.pid" 2>/dev/null || echo missing)"
          tail -n 120 "$RUNNER_TEMP/thoidai-new.log" 2>/dev/null | while IFS= read -r line; do echo "::error title=New app log::$line"; done || true
          tail -n 120 "$RUNNER_TEMP/thoidai-new-http.log" 2>/dev/null | while IFS= read -r line; do echo "::error title=New HTTP E2E::$line"; done || true
          tail -n 120 "$RUNNER_TEMP/thoidai-new-browser.log" 2>/dev/null | while IFS= read -r line; do echo "::error title=Browser E2E::$line"; done || true
          tail -n 120 "$RUNNER_TEMP/thoidai-gateway.log" 2>/dev/null | while IFS= read -r line; do echo "::warning title=Sandbox gateway::$line"; done || true

      - name: Sandbox resource evidence
        if: always()
        shell: bash
        run: |
          df -h "$RUNNER_TEMP" || true
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true

      - name: Destroy disposable sandbox and worktrees
        if: always()
        shell: bash
        run: |
          git worktree remove --force "$RUNNER_TEMP/thoidai-old" 2>/dev/null || true
          git worktree remove --force "$RUNNER_TEMP/thoidai-new" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/thoidai-e2e.env" ]; then
            network=$(sed -n 's/^E2E_NETWORK=//p' "$RUNNER_TEMP/thoidai-e2e.env")
            postgres=$(sed -n 's/^E2E_POSTGRES_CONTAINER=//p' "$RUNNER_TEMP/thoidai-e2e.env")
            postgrest=$(sed -n 's/^E2E_POSTGREST_CONTAINER=//p' "$RUNNER_TEMP/thoidai-e2e.env")
            docker rm -f "$postgrest" "$postgres" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
            rm -f "$RUNNER_TEMP/thoidai-e2e.env"
          fi
